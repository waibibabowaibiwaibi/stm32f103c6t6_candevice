version: "4.1"
name: c6t6
type: ARM
deviceName: STM32F103C6
packDir: .pack/Keil/STM32F1xx_DFP.2.3.0
srcDirs:
  - Core
  - Drivers
  - Middlewares/ST/STM32_USB_Device_Library
  - USB_DEVICE
virtualFolder:
  name: <virtual_root>
  files:
    - path: startup_stm32f103x6.s
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: caa5ba6a5e674af23c3d1598a13816df
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - STM32F103x6
        - USE_HAL_DRIVER
      incList:
        - .
        - Core/Inc
        - Drivers/STM32F1xx_HAL_Driver/Inc
        - Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
        - Drivers/CMSIS/Include
        - Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - USB_DEVICE/App
        - USB_DEVICE/Target
        - Middlewares/ST/STM32_USB_Device_Library/Core/Inc
        - Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
      libList: []
    excludeList:
      - Drivers/CMSIS
      - Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_uart.c
    settings:
      debugger: cortex-debug
    toolchain: LLVM_ARM
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: ""
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: ""
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F103XX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
      LLVM_ARM:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 1
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-2
            warnings: all-warnings
          global:
            $float-abi-type: hard
            output-debug-info: enable
          linker:
            $outputTaskExcludes: []
            $toolName: auto
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F103XX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: cmsis-dap
        target: stm32f1x
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: HWrst
        runAfterProgram: true
        speed: 4000
    uploader: OpenOCD
